<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzón CUC Escucha | Facultad de Ingeniería</title>
    <!-- Enlace a la hoja de estilos externa -->
    <link rel="stylesheet" href="\.\css\style.css">
</head>
<body>

    <div class="container">
        <!-- Vista del Formulario -->
        <div id="form-container">
            <header>
                <span class="badge">Facultad de Ingeniería</span>
                <h1>Buzón CUC Escucha</h1>
                <p class="description">Comparte tus ideas y sugerencias para mejorar nuestra experiencia institucional.</p>
            </header>

            <form id="suggestion-form">
                <div class="form-group">
                    <label for="category">Categoría</label>
                    <select id="category" required>
                        <option value="" disabled selected>Selecciona un aspecto...</option>
                        <option value="bienestar">Bienestar</option>
                        <option value="servicios">Servicios</option>
                        <option value="clases">Clases</option>
                        <option value="inclusion">Inclusión</option>
                        <option value="espacios">Espacios físicos</option>
                        <option value="procesos">Procesos académicos</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="suggestion">Tu sugerencia o idea</label>
                    <textarea id="suggestion" placeholder="Describe tu propuesta detalladamente..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="email">Correo institucional (Opcional)</label>
                    <input type="email" id="email" placeholder="tu_usuario@cuc.edu.co">
                </div>

                <button type="submit">Enviar sugerencia</button>
            </form>
        </div>

        <!-- Vista de Confirmación (Integrada en el mismo espacio) -->
        <div id="success-message">
            <h2>¡Gracias por participar!</h2>
            <p>Tu sugerencia ha sido registrada exitosamente y será tenida en cuenta por la Facultad de Ingeniería.</p>
            <button id="reset-btn">Enviar otra sugerencia</button>
        </div>
    </div>

    <script>
        // Script front-end para la interacción dinámica dentro del mismo contenedor
        const form = document.getElementById('suggestion-form');
        const formContainer = document.getElementById('form-container');
        const successMessage = document.getElementById('success-message');
        const resetBtn = document.getElementById('reset-btn');

        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Evita recargar la página
            formContainer.style.display = 'none';
            successMessage.style.display = 'block';
        });

        resetBtn.addEventListener('click', function() {
            form.reset();
            successMessage.style.display = 'none';
            formContainer.style.display = 'block';
        });
    </script>
</body>
</html>
